[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cubebridge"
version = "0.1.0"
description = "Local helper that connects Excel for Mac to SQL Server Analysis Services"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "pyspnego>=0.12,<0.13",
  "keyring>=24",
  "cryptography>=42",
  "gssapi>=1.9 ; sys_platform == 'darwin'",
  "krb5>=0.7 ; sys_platform == 'darwin'",
  "truststore>=0.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/cubebridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
